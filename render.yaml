# Render Blueprint: one free web service that builds the Dockerfile and serves the
# whole site (React app and API) from one address. Pushes to main deploy automatically.
services:
  - type: web
    name: skillsync
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # Empty: demo mode until a GEMINI_API_KEY is added in the Render dashboard.
      - key: SKILLSYNC_EXTRACTOR
        value: ""
      # GoatCounter site for anonymous visit counts; public anyway, since it is in the page.
      - key: GOATCOUNTER_CODE
        value: skillsync
      # Tried in order when the main model is busy or its daily quota is used up; on the
      # free tier each model has its own quota. A name the key cannot use is skipped.
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash,gemini-3.5-flash-lite
